[project]
name = "tailored-tuition-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long prose lines in prompts; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
